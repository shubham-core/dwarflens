name: DwarfLens Binary Size Analysis
description: Analyze binary size and DWARF struct layouts, compare base vs head, upload to SaaS, post PR comment

inputs:
  base-binary:
    description: 'Path to base binary (e.g. from main branch)'
    required: false
  target-binary:
    description: 'Path to target binary (e.g. from PR branch)'
    required: true
  format:
    description: 'Output format: table|json|markdown'
    required: false
    default: 'markdown'
  max-growth-bytes:
    description: 'Fail if binary grows by more than N bytes (-1 = disabled)'
    required: false
    default: '-1'
  fail-on-padding-regression:
    description: 'Fail if struct padding increases'
    required: false
    default: 'false'
  dwarflens-version:
    description: 'DwarfLens version/ref to use (e.g. v0.1.0, latest, source)'
    required: false
    default: 'v0.1.0'
  api-url:
    description: 'DwarfLens SaaS API URL (e.g. https://api.dwarflens.dev or http://your-server:3000)'
    required: false
    default: ''
  api-key:
    description: 'DwarfLens SaaS API key (Bearer token)'
    required: false
    default: ''
  build-name:
    description: 'Build target identifier (e.g. release, debug, arm64)'
    required: false
    default: 'default'

outputs:
  report:
    description: 'The full analysis report'
    value: ${{ steps.analyze.outputs.report }}
  exceeded-threshold:
    description: 'true if binary growth exceeded max-growth-bytes'
    value: ${{ steps.analyze.outputs.exceeded_threshold }}
  analysis-id:
    description: 'ID of uploaded SaaS analysis if api-key was configured'
    value: ${{ steps.upload.outputs.analysis_id }}

runs:
  using: composite
  steps:
    - name: Setup DwarfLens
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        VERSION: ${{ inputs.dwarflens-version }}
      run: |
        set -euo pipefail
        echo "🔍 Setting up DwarfLens (version: ${VERSION})..."
        
        # 1. Try to find pre-built dwarflens in PATH
        if command -v dwarflens &>/dev/null; then
          echo "✅ Found dwarflens in PATH: $(which dwarflens)"
          echo "DWARFLENS_BIN=dwarflens" >> "$GITHUB_ENV"
          exit 0
        fi

        # 2. If VERSION is not 'source', attempt to download pinned binary with SHA256 check
        DOWNLOADED=false
        if [ "${VERSION}" != "source" ]; then
          OS_TYPE="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH_TYPE="$(uname -m)"
          
          ARCH=""
          case "${ARCH_TYPE}" in
            x86_64|amd64) ARCH="x86_64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          
          OS=""
          case "${OS_TYPE}" in
            linux*) OS="linux" ;;
            darwin*) OS="macos" ;;
          esac
          
          if [ -n "${OS}" ] && [ -n "${ARCH}" ]; then
            ARCHIVE_NAME="dwarflens-${OS}-${ARCH}.tar.gz"
            DOWNLOAD_DIR="${RUNNER_TEMP}/dwarflens_download"
            mkdir -p "${DOWNLOAD_DIR}"
            
            BASE_URL="https://github.com/shubham-core/dwarflens/releases/download/${VERSION}"
            echo "Attempting to download release archive: ${BASE_URL}/${ARCHIVE_NAME}..."
            
            if curl -fsSL "${BASE_URL}/${ARCHIVE_NAME}" -o "${DOWNLOAD_DIR}/${ARCHIVE_NAME}" 2>/dev/null && \
               curl -fsSL "${BASE_URL}/${ARCHIVE_NAME}.sha256" -o "${DOWNLOAD_DIR}/${ARCHIVE_NAME}.sha256" 2>/dev/null; then
              
              echo "Verifying SHA256 checksum..."
              (
                cd "${DOWNLOAD_DIR}"
                if command -v sha256sum &>/dev/null; then
                  sha256sum -c "${ARCHIVE_NAME}.sha256"
                elif command -v shasum &>/dev/null; then
                  shasum -a 256 -c "${ARCHIVE_NAME}.sha256"
                else
                  EXPECTED_SHA=$(awk '{print $1}' "${ARCHIVE_NAME}.sha256")
                  ACTUAL_SHA=$(openssl dgst -sha256 "${ARCHIVE_NAME}" | awk '{print $NF}')
                  [ "${EXPECTED_SHA}" = "${ACTUAL_SHA}" ]
                fi
              )
              
              echo "✅ Checksum verified. Extracting archive..."
              tar -xzf "${DOWNLOAD_DIR}/${ARCHIVE_NAME}" -C "${DOWNLOAD_DIR}"
              chmod +x "${DOWNLOAD_DIR}/dwarflens"
              echo "DWARFLENS_BIN=${DOWNLOAD_DIR}/dwarflens" >> "$GITHUB_ENV"
              echo "✅ DwarfLens ${VERSION} installed successfully from release binary"
              DOWNLOADED=true
            else
              echo "Release binary not available for ${VERSION} on ${OS}-${ARCH}; falling back to source build."
            fi
          fi
        fi

        # 3. Fallback: Build from source using ACTION_PATH/..
        if [ "${DOWNLOADED}" != "true" ]; then
          echo "Building DwarfLens from source..."
          DWARFLENS_BUILD_DIR="${RUNNER_TEMP}/dwarflens_build"
          
          # Prioritize action path source repo, fallback to workspace or clone
          if [ -f "${ACTION_PATH}/../CMakeLists.txt" ]; then
            DWARFLENS_SRC_DIR="${ACTION_PATH}/.."
          elif [ -f "${GITHUB_WORKSPACE}/CMakeLists.txt" ] && \
               grep -q "dwarflens" "${GITHUB_WORKSPACE}/CMakeLists.txt" 2>/dev/null; then
            DWARFLENS_SRC_DIR="${GITHUB_WORKSPACE}"
          else
            echo "Cloning DwarfLens repository (${VERSION})..."
            DWARFLENS_SRC_DIR="${RUNNER_TEMP}/dwarflens_repo"
            git clone --depth 1 --branch "${VERSION}" https://github.com/shubham-core/dwarflens.git "${DWARFLENS_SRC_DIR}" 2>/dev/null || \
            git clone --depth 1 https://github.com/shubham-core/dwarflens.git "${DWARFLENS_SRC_DIR}"
          fi
          
          mkdir -p "${DWARFLENS_BUILD_DIR}"
          cmake -S "${DWARFLENS_SRC_DIR}" -B "${DWARFLENS_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            2>&1 | tail -5
          cmake --build "${DWARFLENS_BUILD_DIR}" --target dwarflens -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)" 2>&1 | tail -10
          
          echo "DWARFLENS_BIN=${DWARFLENS_BUILD_DIR}/dwarflens" >> "$GITHUB_ENV"
          echo "✅ DwarfLens built successfully from source"
        fi

    - name: Run Analysis
      id: analyze
      shell: bash
      env:
        TARGET_BINARY: ${{ inputs.target-binary }}
        BASE_BINARY: ${{ inputs.base-binary }}
        FORMAT: ${{ inputs.format }}
        MAX_GROWTH: ${{ inputs.max-growth-bytes }}
        FAIL_PADDING: ${{ inputs.fail-on-padding-regression }}
      run: |
        set -euo pipefail
        
        DWARFLENS="${DWARFLENS_BIN:-dwarflens}"
        
        REPORT_FILE="${RUNNER_TEMP}/dwarflens_report.md"
        EXIT_CODE=0
        
        if [ -n "${BASE_BINARY}" ] && [ -f "${BASE_BINARY}" ]; then
          echo "Running: dwarflens diff ${BASE_BINARY} ${TARGET_BINARY}"
          
          EXTRA_FLAGS=""
          if [ "${MAX_GROWTH}" != "-1" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --max-growth-bytes=${MAX_GROWTH}"
          fi
          if [ "${FAIL_PADDING}" = "true" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --fail-on-padding-regression"
          fi
          
          "${DWARFLENS}" diff "${BASE_BINARY}" "${TARGET_BINARY}" \
            --format="${FORMAT}" ${EXTRA_FLAGS} > "${REPORT_FILE}" 2>&1 || EXIT_CODE=$?
        else
          echo "Running: dwarflens analyze ${TARGET_BINARY}"
          "${DWARFLENS}" analyze "${TARGET_BINARY}" --format="${FORMAT}" > "${REPORT_FILE}" 2>&1 || EXIT_CODE=$?
        fi
        
        # Output to GitHub Step Summary
        cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"
        
        # Set outputs
        REPORT=$(cat "${REPORT_FILE}")
        echo "report<<EOF" >> "$GITHUB_OUTPUT"
        echo "${REPORT}" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "exceeded_threshold=true" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        else
          echo "exceeded_threshold=false" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Analysis to SaaS
      id: upload
      if: always() && inputs.api-url != '' && inputs.api-key != ''
      shell: bash
      env:
        TARGET_BINARY: ${{ inputs.target-binary }}
        API_URL: ${{ inputs.api-url }}
        API_KEY: ${{ inputs.api-key }}
        BUILD_NAME: ${{ inputs.build-name }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_COMMIT_SHA: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.ref_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        
        DWARFLENS="${DWARFLENS_BIN:-dwarflens}"
        JSON_PAYLOAD="${RUNNER_TEMP}/dwarflens_upload.json"
        
        echo "📊 Generating JSON analysis for SaaS upload..."
        COMMIT_SHA="${DEFAULT_COMMIT_SHA}"
        BRANCH="${DEFAULT_BRANCH}"
        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_HEAD_SHA}" ]; then
          COMMIT_SHA="${PR_HEAD_SHA}"
          BRANCH="${PR_HEAD_REF}"
        fi
        
        "${DWARFLENS}" analyze "${TARGET_BINARY}" \
          --format=json \
          --repo="${GITHUB_REPOSITORY}" \
          --commit="${COMMIT_SHA}" \
          --branch="${BRANCH}" \
          --build-name="${BUILD_NAME}" > "${JSON_PAYLOAD}"
        
        echo "🚀 Uploading analysis to ${API_URL}/api/v1/analyses..."
        RESPONSE=$(curl -fsSL -X POST "${API_URL}/api/v1/analyses" \
          -H "Authorization: Bearer ${API_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary "@${JSON_PAYLOAD}")
        
        echo "Server response: ${RESPONSE}"
        ANALYSIS_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')
        echo "analysis_id=${ANALYSIS_ID}" >> "$GITHUB_OUTPUT"
        echo "✅ Analysis uploaded successfully (ID: ${ANALYSIS_ID})"

        BUDGET_PASSED=$(echo "${RESPONSE}" | jq -r '.budget_status.passed // true')
        if [ "${BUDGET_PASSED}" = "false" ]; then
          BUDGET_REASONS=$(echo "${RESPONSE}" | jq -r '.budget_status.reasons // [] | join("\n- ")')
          echo "❌ Project budget check failed on DwarfLens server:"
          echo "- ${BUDGET_REASONS}"
          
          REPORT_FILE="${RUNNER_TEMP}/dwarflens_report.md"
          echo -e "\n\n### ❌ DwarfLens CI Budget Failures\n- ${BUDGET_REASONS}\n" >> "${REPORT_FILE}"
          echo -e "\n\n### ❌ DwarfLens CI Budget Failures\n- ${BUDGET_REASONS}\n" >> "$GITHUB_STEP_SUMMARY"
          
          echo "budget_failed=true" >> "$GITHUB_OUTPUT"
        else
          echo "budget_failed=false" >> "$GITHUB_OUTPUT"
          echo "✅ All project budgets passed successfully."
        fi

    - name: Post PR Comment
      if: always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        set -euo pipefail
        
        REPORT_FILE="${RUNNER_TEMP}/dwarflens_report.md"
        
        if [ ! -f "${REPORT_FILE}" ]; then
          echo "No report file found to comment."
          exit 0
        fi
        
        # Create comment body with stable identifier marker
        COMMENT_BODY="<!-- dwarflens-pr-comment -->
## 🔍 DwarfLens Binary Size Report

$(cat "${REPORT_FILE}")

---
*Generated by [DwarfLens](https://github.com/shubham-core/dwarflens) — Binary Size & DWARF Layout Analyzer*"
        
        # Find existing comment with marker to update (avoids comment spam)
        COMMENT_ID=$(gh api \
          "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("<!-- dwarflens-pr-comment -->") or contains("DwarfLens Binary Size Report")) | .id' \
          2>/dev/null | head -1 || true)
        
        if [ -n "${COMMENT_ID}" ]; then
          # Update existing comment
          if ! gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f "body=${COMMENT_BODY}" > /dev/null 2>&1; then
            echo "⚠️ Warning: Failed to update PR comment (fork PR or missing 'pull-requests: write' permission)."
          else
            echo "Updated existing PR comment #${COMMENT_ID}"
          fi
        else
          # Create new comment
          if ! gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f "body=${COMMENT_BODY}" > /dev/null 2>&1; then
            echo "⚠️ Warning: Failed to post PR comment (fork PR or missing 'pull-requests: write' permission)."
          else
            echo "Posted new PR comment"
          fi
        fi

    - name: Check Final Status
      if: always()
      shell: bash
      env:
        EXCEEDED_THRESHOLD: ${{ steps.analyze.outputs.exceeded_threshold }}
        ANALYSIS_EXIT: ${{ steps.analyze.outputs.exit_code }}
        BUDGET_FAILED: ${{ steps.upload.outputs.budget_failed }}
      run: |
        set -euo pipefail
        FAILED=false
        if [ "${EXCEEDED_THRESHOLD:-false}" = "true" ] || [ "${ANALYSIS_EXIT:-0}" != "0" ]; then
          echo "❌ DwarfLens analysis threshold check failed."
          FAILED=true
        fi
        if [ "${BUDGET_FAILED:-false}" = "true" ]; then
          echo "❌ DwarfLens SaaS budget evaluation failed."
          FAILED=true
        fi
        if [ "${FAILED}" = "true" ]; then
          echo "Failing job because thresholds or budgets were violated."
          exit 1
        fi
        echo "✅ All DwarfLens analysis thresholds and budgets passed."
