name: DwarfLens Binary Size Analysis
description: Analyze binary size and DWARF struct layouts, compare base vs head, post PR comment

inputs:
  base-binary:
    description: 'Path to base binary (e.g. from main branch)'
    required: false
  target-binary:
    description: 'Path to target binary (e.g. from PR branch)'
    required: true
  format:
    description: 'Output format: table|json|markdown'
    required: false
    default: 'markdown'
  max-growth-bytes:
    description: 'Fail if binary grows by more than N bytes (-1 = disabled)'
    required: false
    default: '-1'
  fail-on-padding-regression:
    description: 'Fail if struct padding increases'
    required: false
    default: 'false'
  dwarflens-version:
    description: 'DwarfLens version/ref to use'
    required: false
    default: 'main'

outputs:
  report:
    description: 'The full analysis report'
    value: ${{ steps.analyze.outputs.report }}
  exceeded-threshold:
    description: 'true if binary growth exceeded max-growth-bytes'
    value: ${{ steps.analyze.outputs.exceeded_threshold }}

runs:
  using: composite
  steps:
    - name: Setup DwarfLens
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Setting up DwarfLens..."
        
        # Try to find pre-built dwarflens in PATH
        if command -v dwarflens &>/dev/null; then
          echo "✅ Found dwarflens in PATH: $(which dwarflens)"
          echo "DWARFLENS_BIN=dwarflens" >> $GITHUB_ENV
        else
          # Build from source
          echo "Building DwarfLens from source..."
          DWARFLENS_BUILD_DIR="${RUNNER_TEMP}/dwarflens_build"
          DWARFLENS_SRC_DIR="${RUNNER_TEMP}/dwarflens_src"
          
          # Clone or use local
          if [ -f "${{ github.workspace }}/CMakeLists.txt" ] && \
             grep -q "dwarflens" "${{ github.workspace }}/CMakeLists.txt" 2>/dev/null; then
            DWARFLENS_SRC_DIR="${{ github.workspace }}"
          fi
          
          mkdir -p "${DWARFLENS_BUILD_DIR}"
          cmake -S "${DWARFLENS_SRC_DIR}" -B "${DWARFLENS_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            2>&1 | tail -5
          cmake --build "${DWARFLENS_BUILD_DIR}" --target dwarflens -j$(nproc) 2>&1 | tail -10
          
          echo "DWARFLENS_BIN=${DWARFLENS_BUILD_DIR}/dwarflens" >> $GITHUB_ENV
          echo "✅ DwarfLens built successfully"
        fi

    - name: Run Analysis
      id: analyze
      shell: bash
      run: |
        set -euo pipefail
        
        DWARFLENS="${DWARFLENS_BIN:-dwarflens}"
        TARGET_BINARY="${{ inputs.target-binary }}"
        BASE_BINARY="${{ inputs.base-binary }}"
        FORMAT="${{ inputs.format }}"
        MAX_GROWTH="${{ inputs.max-growth-bytes }}"
        FAIL_PADDING="${{ inputs.fail-on-padding-regression }}"
        
        REPORT_FILE="${RUNNER_TEMP}/dwarflens_report.md"
        EXIT_CODE=0
        
        if [ -n "${BASE_BINARY}" ] && [ -f "${BASE_BINARY}" ]; then
          echo "Running: dwarflens diff ${BASE_BINARY} ${TARGET_BINARY}"
          
          EXTRA_FLAGS=""
          if [ "${MAX_GROWTH}" != "-1" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --max-growth-bytes=${MAX_GROWTH}"
          fi
          if [ "${FAIL_PADDING}" = "true" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --fail-on-padding-regression"
          fi
          
          "${DWARFLENS}" diff "${BASE_BINARY}" "${TARGET_BINARY}" \
            --format="${FORMAT}" ${EXTRA_FLAGS} > "${REPORT_FILE}" 2>&1 || EXIT_CODE=$?
        else
          echo "Running: dwarflens analyze ${TARGET_BINARY}"
          "${DWARFLENS}" analyze "${TARGET_BINARY}" --format="${FORMAT}" > "${REPORT_FILE}" 2>&1 || EXIT_CODE=$?
        fi
        
        # Output to GitHub Step Summary
        cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"
        
        # Set outputs
        REPORT=$(cat "${REPORT_FILE}")
        echo "report<<EOF" >> $GITHUB_OUTPUT
        echo "${REPORT}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "exceeded_threshold=true" >> $GITHUB_OUTPUT
        else
          echo "exceeded_threshold=false" >> $GITHUB_OUTPUT
        fi
        
        exit $EXIT_CODE

    - name: Post PR Comment
      if: github.event_name == 'pull_request' && inputs.format == 'markdown'
      shell: bash
      run: |
        set -euo pipefail
        
        REPORT_FILE="${RUNNER_TEMP}/dwarflens_report.md"
        
        # Create comment body
        COMMENT_BODY="## 🔍 DwarfLens Binary Size Report\n\n$(cat "${REPORT_FILE}")\n\n---\n*Generated by [DwarfLens](https://github.com/shubham-core/dwarflens) — Binary Size & DWARF Layout Analyzer*"
        
        # Find existing comment to update (avoids comment spam)
        COMMENT_ID=$(gh api \
          "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
          --jq '.[] | select(.body | contains("DwarfLens Binary Size Report")) | .id' \
          2>/dev/null | head -1 || true)
        
        if [ -n "${COMMENT_ID}" ]; then
          # Update existing comment
          gh api --method PATCH \
            "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
            -f "body=${COMMENT_BODY}" > /dev/null
          echo "Updated existing PR comment #${COMMENT_ID}"
        else
          # Create new comment
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            -f "body=${COMMENT_BODY}" > /dev/null
          echo "Posted new PR comment"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
